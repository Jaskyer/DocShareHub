version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: doc-hosting-platform
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:8000"
    volumes:
      # Persist SQLite database
      - data:/app/data
      # Persist uploaded files
      - uploads:/app/uploads
      # Environment configuration
      - ../.env:/app/.env:ro
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite+aiosqlite:///data/app.db
      - UPLOAD_DIR=/app/uploads
    env_file:
      - ../.env

volumes:
  data:
  uploads:
