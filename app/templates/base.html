<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}文档托管平台{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/light-theme.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/main.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <svg class="nav-logo" width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="6" fill="#1677FF"/>
                    <path d="M7 8h14v2H7zM7 13h14v2H7zM7 18h10v2H7z" fill="white"/>
                </svg>
                <span>文档托管平台</span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="/" class="nav-link">首页</a>
                <a href="/my-projects" class="nav-link" id="navMyProjects" style="display:none">我的项目</a>
                <a href="/my-projects/favorites" class="nav-link" id="navFavorites" style="display:none">我的收藏</a>
            </div>
            <div class="nav-actions">
                <div id="userInfo" style="display:none" class="user-info">
                    <img id="userAvatar" class="user-avatar" src="" alt="avatar">
                    <span id="userName" class="user-name"></span>
                    <button class="btn btn-ghost btn-sm" onclick="logout()">退出</button>
                </div>
                <a href="/login" class="btn btn-primary btn-sm" id="loginBtn">登录</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <span>文档托管平台 &copy; 2026</span>
        </div>
    </footer>

    <script>window.__INITIAL_USER__ = {{ request.scope.get("user") | tojson }};</script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
