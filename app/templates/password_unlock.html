{% extends "base.html" %}
{% block title %}输入密码 - 文档托管平台{% endblock %}
{% block content %}
<div class="unlock-container">
    <div class="card">
        <div class="card-body" style="text-align:center;padding:40px;">
            <div style="font-size:48px;margin-bottom:16px;opacity:0.5;">🔑</div>
            <h2 style="margin-bottom:8px;">此项目需要密码</h2>
            <p style="color:var(--text-secondary);font-size:var(--font-size-sm);margin-bottom:24px;">
                {{ project_name }} 需要输入密码才能访问
            </p>
            <form onsubmit="return verifyPassword(event)">
                <div class="form-group">
                    <input type="password" class="form-input" id="password" placeholder="请输入访问密码" required style="text-align:center;font-size:16px;">
                </div>
                <button type="submit" class="btn btn-primary btn-lg" id="unlockBtn" style="width:100%;">验证密码</button>
            </form>
            <div id="errorMsg" style="color:var(--error);font-size:var(--font-size-xs);margin-top:var(--spacing-sm);display:none;"></div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
async function verifyPassword(e) {
    e.preventDefault();
    const btn = document.getElementById('unlockBtn');
    const errorMsg = document.getElementById('errorMsg');
    btn.disabled = true;
    btn.textContent = '验证中...';
    errorMsg.style.display = 'none';

    try {
        const data = await API.post('/api/projects/{{ project_id }}/verify-password', {
            password: document.getElementById('password').value
        });
        // Redirect to the original URL
        const next = new URLSearchParams(window.location.search).get('next') || '/{{ visible_path }}';
        window.location.href = next;
    } catch (err) {
        errorMsg.textContent = '密码错误，请重试';
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '验证密码';
    }
    return false;
}
</script>
{% endblock %}
