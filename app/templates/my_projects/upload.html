{% extends "base.html" %}
{% block title %}上传文档 - 文档托管平台{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">上传文档</h1>
        <p class="page-subtitle" id="projectInfo">项目 #{{ project_id }}</p>
    </div>
    <a href="/my-projects" class="btn btn-ghost">返回</a>
</div>

<div class="card">
    <div class="card-body">
        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <path d="M24 6v24M12 18l12-12 12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M8 34v4a4 4 0 004 4h24a4 4 0 004-4v-4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="drop-zone-text">拖拽文件到此处上传，或点击选择文件</div>
            <div class="drop-zone-hint">支持上传 HTML、CSS、JS、图片等文件，也可以上传整个文件夹</div>
        </div>
        <input type="file" id="fileInput" multiple style="display:none">
        <input type="file" id="folderInput" multiple webkitdirectory style="display:none">

        <div style="display:flex;gap:var(--spacing-sm);margin-top:var(--spacing-md);justify-content:center;">
            <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">选择文件</button>
            <button class="btn btn-outline" onclick="document.getElementById('folderInput').click()">选择文件夹</button>
        </div>

        <div id="uploadProgress" style="display:none;margin-top:var(--spacing-lg);">
            <div style="display:flex;justify-content:space-between;font-size:var(--font-size-sm);margin-bottom:var(--spacing-xs);">
                <span id="progressText">上传中...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div style="background:var(--bg-base);border-radius:var(--radius-sm);height:8px;overflow:hidden;">
                <div id="progressBar" style="background:var(--primary);height:100%;width:0%;transition:width 0.3s ease;"></div>
            </div>
        </div>

        <div id="uploadResult" style="margin-top:var(--spacing-lg);display:none;"></div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="/static/js/upload.js"></script>
<script>
async function loadProjectInfo() {
    try {
        if (!(await requireAuth())) return;
        const data = await API.get('/api/projects/{{ project_id }}');
        const p = data.project;
        document.getElementById('projectInfo').textContent = `${escapeHtml(p.name)} / ${escapeHtml(p.visible_path)}`;
    } catch (err) {
        // ignore
    }
}
document.addEventListener('DOMContentLoaded', loadProjectInfo);
</script>
{% endblock %}
