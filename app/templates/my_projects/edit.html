{% extends "base.html" %}
{% block title %}编辑项目 - 文档托管平台{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">编辑项目</h1>
        <p class="page-subtitle">修改项目配置</p>
    </div>
</div>

<div class="card" style="max-width:640px;">
    <div class="card-body">
        <form id="editProjectForm" onsubmit="return onSubmit(event)">
            <div class="form-group">
                <label class="form-label">项目名称 <span class="required">*</span></label>
                <input type="text" class="form-input" id="name" required maxlength="256" placeholder="输入项目名称">
            </div>
            <div class="form-group">
                <label class="form-label">项目描述</label>
                <textarea class="form-textarea" id="description" placeholder="可选，简单描述项目内容" maxlength="2000"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">可见路径 <span class="required">*</span></label>
                <input type="text" class="form-input" id="visiblePath" required pattern="[a-z0-9_\-/]+" placeholder="如: engineering-docs">
                <div class="form-hint" id="visiblePathHint">修改可见路径后，旧的访问链接将失效</div>
            </div>
            <div class="form-group">
                <label class="form-label">安全等级 <span class="required">*</span></label>
                <select class="form-select" id="securityLevel"></select>
            </div>
            <div class="form-group">
                <label class="form-label">访问密码</label>
                <input type="text" class="form-input" id="password" placeholder="留空保持原密码，输入新密码替换">
                <div class="form-hint">如需清除密码，请输入 "CLEAR"</div>
            </div>
            <div class="form-group">
                <label class="form-label">
                    <input type="checkbox" id="allowListing">
                    允许目录列表
                </label>
                <div class="form-hint">关闭后访问目录不显示文件列表，可防止文件被遍历扫描</div>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">保存修改</button>
                <a href="/my-projects" class="btn btn-ghost btn-lg">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
async function loadProject() {
    try {
        if (!(await requireAuth())) return;
        const data = await API.get('/api/projects/{{ project_id }}');
        const p = data.project;
        document.getElementById('name').value = p.name;
        document.getElementById('description').value = p.description || '';
        document.getElementById('visiblePath').value = p.visible_path;

        document.getElementById('allowListing').checked = p.allow_listing !== false;

        const sel = document.getElementById('securityLevel');
        const levels = [
            { v: 1, l: 'L1 - 完全公开，无需登录' },
            { v: 2, l: 'L2 - 公开，无需登录' },
            { v: 3, l: 'L3 - 需飞书登录后访问' },
            { v: 4, l: 'L4 - 需飞书登录并申请审批' },
        ];
        sel.innerHTML = levels.map(l =>
            `<option value="${l.v}" ${l.v === p.security_level ? 'selected' : ''}>${l.l}</option>`
        ).join('');
    } catch (err) {
        showToast('加载项目信息失败', 'error');
    }
}

async function onSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '保存中...';

    try {
        const body = {
            name: document.getElementById('name').value.trim(),
            description: document.getElementById('description').value.trim() || null,
            visible_path: document.getElementById('visiblePath').value.trim(),
            security_level: parseInt(document.getElementById('securityLevel').value),
            allow_listing: document.getElementById('allowListing').checked,
        };
        const pw = document.getElementById('password').value;
        if (pw === 'CLEAR') body.password = '';
        else if (pw) body.password = pw;

        await API.put('/api/projects/{{ project_id }}', body);
        showToast('项目已更新', 'success');
        window.location.href = '/my-projects';
    } catch (err) {
        var msg = err.message || '保存失败';
        if (msg.indexOf('可见路径') !== -1) {
            var input = document.getElementById('visiblePath');
            var hint = document.getElementById('visiblePathHint');
            input.style.borderColor = 'var(--error)';
            hint.textContent = msg;
            hint.style.color = 'var(--error)';
            input.focus();
        } else {
            showToast(msg, 'error');
        }
        btn.disabled = false;
        btn.textContent = '保存修改';
    }
    return false;
}

document.addEventListener('DOMContentLoaded', loadProject);
</script>
{% endblock %}
